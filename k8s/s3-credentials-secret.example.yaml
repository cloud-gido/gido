# S3 静态 AK/SK（FLINK_OPERATOR_S3_AUTH_MODE=static 时使用）
#
# Backend Secret（gido 命名空间）：
#   kubectl create secret generic gido-s3-credentials \
#     --from-literal=GIDO_S3_ACCESS_KEY_ID=AKIA... \
#     --from-literal=GIDO_S3_SECRET_ACCESS_KEY=... \
#     -n gido
#
# 在 gido-backend Deployment 中 envFrom 引用，或写入 gido-secrets stringData。
# Flink 作业 Pod 的 AWS_* 由 GIDO 提交时从同一平台配置注入（勿把密钥写入 ConfigMap）。
#
# IRSA 模式（推荐 EKS）：无需本 Secret，见 k8s/eks/flink-s3-irsa.example.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: gido-s3-credentials
  namespace: gido
type: Opaque
stringData:
  GIDO_S3_ACCESS_KEY_ID: "CHANGE_ME_AWS_ACCESS_KEY_ID"
  GIDO_S3_SECRET_ACCESS_KEY: "CHANGE_ME_AWS_SECRET_ACCESS_KEY"
  # GIDO_S3_SESSION_TOKEN: ""
