# DolphinScheduler API — 局域网 NodePort（集群内仍用 ClusterIP dolphinscheduler-api:12345）
apiVersion: v1
kind: Service
metadata:
  name: dolphinscheduler-api-lan
  namespace: dolphinscheduler
  labels:
    app: dolphinscheduler
spec:
  type: NodePort
  selector:
    app: dolphinscheduler
    component: api
  ports:
    - name: http
      port: 12345
      targetPort: 12345
      nodePort: 31245
