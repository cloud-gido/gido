# K3s 联调：Flink Pod 使用静态 AK/SK 访问 S3（仅测试，生产用 IRSA）
#
#   cp k8s/paimon-s3-aws-secret.example.yaml /tmp/paimon-s3-aws-secret.yaml
#   # 编辑 stringData 填入 gido-paimon 的 AK/SK
#   kubectl apply -f /tmp/paimon-s3-aws-secret.yaml
#
# 当前 GIDO 提交路径仍建议在 SQL 的 Paimon 表属性里带 s3.access-key（见 k8s/examples/*.sql）。
# 本 Secret 供后续扩展 podTemplate envFrom 或手工 kubectl run 验证 S3 连通性。
---
apiVersion: v1
kind: Secret
metadata:
  name: gido-paimon-s3-credentials
  namespace: flink
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "AKIAxxxxxxxx"
  AWS_SECRET_ACCESS_KEY: "your-secret-access-key"
  AWS_DEFAULT_REGION: "us-east-2"
