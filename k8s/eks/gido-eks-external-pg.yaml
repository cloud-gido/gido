# =============================================================================
# GIDO on AWS EKS — 外置 PostgreSQL（RDS）+ Flink Operator + S3 制品
# =============================================================================
#
# 适用：EKS 上已有 RDS PostgreSQL（元库），不部署集群内 postgres。
#
# 替换占位符（全局搜索 CHANGE_ME）或使用：
#   bash k8s/eks/apply-gido-eks.sh
#
# 前置：
#   1. kubectl create namespace flink   # 本清单也会创建 gido / flink
#   2. kubectl apply -f k8s/flink-operator-rbac.yaml
#   3. kubectl apply -f k8s/eks/flink-s3-irsa.example.yaml   # 替换 ACCOUNT_ID
#   4. Helm 安装 Flink Kubernetes Operator 1.15
#   5. RDS 安全组：允许 EKS worker → TCP 5432
#   6. RDS 上 CREATE DATABASE gido; 首次部署后 init_db.py
#
# S3 示例（与 Flink 侧 resource.* 对齐）：
#   bucket: flink-on-devtest
#   prefix: gido-flink
#   region: ap-southeast-1
#   endpoint: https://s3.ap-southeast-1.amazonaws.com
#   → FLINK_OPERATOR_JAR_S3_PREFIX=s3://flink-on-devtest/gido-flink
#
# 各 Operator 集群可在 UI「Operator 集群」覆盖 S3 region / endpoint / 前缀 / AK/SK。
#
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: flink
---
apiVersion: v1
kind: Namespace
metadata:
  name: gido
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: flink
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "secrets", "persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: flink
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: flink
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gido-backend-config
  namespace: gido
data:
  GIDO_FLINK_SUBMIT_MODE: "operator"
  GIDO_LEGACY_FLINK_SUBMIT: "false"
  GIDO_FLINK_K8S_API_PATCH: "disable"
  DS_ENABLED: "false"
  DS_URL: ""
  DS_UI_URL: ""
  DS_PROJECT_NAME: "GIDO"
  INTERNAL_TOKEN: ""
  DEFAULT_TIMEZONE: "Asia/Shanghai"
  STUDIO_LOCK_ON_PUBLISH: "true"
  JAR_ARTIFACT_DIR: "/data/jar-artifacts"

  FLINK_K8S_NAMESPACE: "flink"
  FLINK_K8S_CLUSTER_DOMAIN: "cluster.local"
  FLINK_OPERATOR_NAMESPACE: "flink"
  FLINK_OPERATOR_SERVICE_ACCOUNT: "flink"
  FLINK_OPERATOR_IMAGE: "CHANGE_ME_FLINK_RUNTIME_IMAGE"
  FLINK_K8S_APPLICATION_IMAGE: "CHANGE_ME_FLINK_RUNTIME_IMAGE"
  FLINK_OPERATOR_FLINK_VERSION: "v2_2"
  FLINK_OPERATOR_IMAGE_PULL_SECRETS: "ghcr-pull"
  FLINK_OPERATOR_UPGRADE_MODE: "savepoint"
  FLINK_OPERATOR_CHECKPOINT_INTERVAL: "60s"
  FLINK_OPERATOR_UI_PROXY_ENABLED: "true"
  FLINK_OPERATOR_DEV_LOCAL: "false"
  FLINK_OPERATOR_AUTO_UI_TUNNEL: "false"
  FLINK_OPERATOR_JM_REST_TEMPLATE: "http://{deployment_name}-rest.{namespace}.svc.cluster.local:8081"
  FLINK_OPERATOR_JAR_HTTP_BASE: "http://backend.CHANGE_ME_GIDO_NAMESPACE.svc.cluster.local:8001"
  FLINK_OPERATOR_SQL_RUNNER_JAR_URI: "local:///opt/flink/usrlib/sql-runner.jar"
  FLINK_OPERATOR_SQL_RUNNER_ENTRY_CLASS: "com.gido.flink.SqlRunner"
  FLINK_OPERATOR_JM_MEMORY: "2048m"
  FLINK_OPERATOR_TM_MEMORY: "2048m"
  FLINK_OPERATOR_JM_CPU: "1"
  FLINK_OPERATOR_TM_CPU: "1"
  FLINK_OPERATOR_TASK_SLOTS: "2"
  FLINK_OPERATOR_NODE_POOL: "bigdata"
  FLINK_OPERATOR_NODE_SELECTOR_KEY: "node.gamelinelab.com/pool"
  FLINK_OPERATOR_TAINT_EFFECT: "NoSchedule"

  # S3（平台默认；双 IRSA：gido-backend 写 + flink 读）
  FLINK_OPERATOR_JAR_S3_PREFIX: "s3://CHANGE_ME_S3_BUCKET/CHANGE_ME_S3_JAR_PREFIX"
  PAIMON_WAREHOUSE_DEFAULT: "s3a://CHANGE_ME_S3_BUCKET/paimon-warehouse"
  FLINK_OPERATOR_CHECKPOINT_DIR: "s3a://CHANGE_ME_S3_BUCKET/flink/checkpoints"
  FLINK_OPERATOR_SAVEPOINT_DIR: "s3a://CHANGE_ME_S3_BUCKET/flink/savepoints"
  FLINK_OPERATOR_S3_AUTH_MODE: "irsa"
  FLINK_OPERATOR_S3_USE_IRSA: "true"
  FLINK_OPERATOR_S3_CREDENTIALS_PROVIDER: "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
  GIDO_ARTIFACT_S3_REGION: "CHANGE_ME_AWS_REGION"
  GIDO_ARTIFACT_S3_ENDPOINT_URL: "CHANGE_ME_S3_ENDPOINT_URL"

  FLINK_URL: ""
  FLINK_SQL_GATEWAY_URL: ""
  FLINK_GATEWAY_JOBMANAGER_REST_URL: ""
  FLINK_UI_URL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: gido-secrets
  namespace: gido
type: Opaque
stringData:
  # 生产推荐：拆分 PG（优先于 DATABASE_URL）
  INFRA_GIDO_DB_SERVICE_URL: "CHANGE_ME_RDS_HOST:5432"
  INFRA_GIDO_DB_SERVICE_USER: "CHANGE_ME_DB_USER"
  INFRA_GIDO_DB_SERVICE_PASSWORD: "CHANGE_ME_DB_PASSWORD_PLAIN"
  INFRA_GIDO_DB_URL: "CHANGE_ME_DB_NAME"
  # 兼容：URL 编码密码版（apply-gido-eks.sh 会写 DATABASE_URL；手工部署可取消注释）
  # DATABASE_URL: "postgresql+psycopg2://CHANGE_ME_DB_USER:CHANGE_ME_DB_PASSWORD@CHANGE_ME_RDS_HOST:5432/CHANGE_ME_DB_NAME"
  SECRET_KEY: "CHANGE_ME_SECRET_KEY"
  FLINK_OPERATOR_ARTIFACT_TOKEN: "CHANGE_ME_ARTIFACT_TOKEN"
  DS_TOKEN: ""
  GIDO_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gido-backend
  namespace: gido
  annotations:
    eks.amazonaws.com/role-arn: "CHANGE_ME_BACKEND_IRSA"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gido-flink-operator
  namespace: flink
rules:
  - apiGroups: ["flink.apache.org"]
    resources: ["flinkdeployments", "flinksessionjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gido-backend-flink-operator
  namespace: flink
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gido-flink-operator
subjects:
  - kind: ServiceAccount
    name: gido-backend
    namespace: gido
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gido-jar-artifacts
  namespace: gido
  labels:
    app: gido
    component: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: gp3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gido-backend
  namespace: gido
  labels:
    app: gido
    component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gido
      component: backend
  template:
    metadata:
      labels:
        app: gido
        component: backend
    spec:
      serviceAccountName: gido-backend
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-postgres
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z CHANGE_ME_RDS_HOST 5432; do
                echo "waiting RDS CHANGE_ME_RDS_HOST:5432"; sleep 3
              done
      containers:
        - name: backend
          image: CHANGE_ME_BACKEND_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: gido-backend-config
            - secretRef:
                name: gido-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: jar-artifacts
              mountPath: /data/jar-artifacts
      volumes:
        - name: jar-artifacts
          persistentVolumeClaim:
            claimName: gido-jar-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gido
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: gido
    component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gido-frontend
  namespace: gido
  labels:
    app: gido
    component: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gido
      component: frontend
  template:
    metadata:
      labels:
        app: gido
        component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: wait-backend
          image: public.ecr.aws/docker/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until wget -qO- http://backend:8001/health >/dev/null 2>&1; do
                echo waiting backend; sleep 3
              done
      containers:
        - name: frontend
          image: CHANGE_ME_FRONTEND_IMAGE
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gido
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: gido
    component: frontend
---
# 可选：AWS Load Balancer Controller（集群须已安装）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gido-ui
  namespace: gido
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:CHANGE_ME_AWS_REGION:CHANGE_ME_AWS_ACCOUNT:certificate/CHANGE_ME_CERT_ID
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: alb
  rules:
    - host: CHANGE_ME_INGRESS_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
