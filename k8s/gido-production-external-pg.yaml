# =============================================================================
# GIDO 生产 K8s — 外置 PostgreSQL + Flink Kubernetes Operator 1.15
# =============================================================================
#
# 本清单不含：集群内 PostgreSQL、Flink Operator 控制器（须 Helm 单独安装）。
#
# 前置（一次性）：
#   1. 外置 PostgreSQL 已建库（如 gido），网络允许 GIDO Pod → PG:5432
#   2. 安装 Flink Kubernetes Operator 1.15.0：
#        bash k8s/upgrade-flink-operator-1.15.sh
#   3. 私有镜像仓库：在 gido、flink 命名空间创建 imagePullSecret（见 flink-image-pull-secret.example.yaml）
#   4. （推荐）S3 制品库：配置下方 S3 占位符；各 Operator 集群可在 UI 覆盖 region/endpoint/前缀
#   5. static S3 认证：kubectl apply -f k8s/s3-credentials-secret.example.yaml 并在 backend 引用
#
# 部署（推荐脚本渲染占位符）：
#   cp k8s/gido-production.env.example k8s/gido-production.env
#   # 编辑 PG / 密钥 / 镜像 / S3
#   bash k8s/apply-gido-production.sh
#
# 首次部署后初始化元库（Backend 启动也会跑迁移，建议显式执行一次）：
#   kubectl -n gido exec deploy/gido-backend -- python init_db.py
#
# 访问（无 Ingress）：
#   kubectl -n gido port-forward svc/frontend 8080:80
#
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:
  name: flink
---
apiVersion: v1
kind: Namespace
metadata:
  name: gido
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: flink
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: flink
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "services", "secrets", "persistentvolumeclaims"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: flink
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: flink
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gido-backend-config
  namespace: gido
data:
  # --- GIDO 核心 ---
  GIDO_FLINK_SUBMIT_MODE: "operator"
  GIDO_LEGACY_FLINK_SUBMIT: "false"
  GIDO_FLINK_K8S_API_PATCH: "disable"
  DS_ENABLED: "false"
  DS_URL: ""
  DS_UI_URL: ""
  DS_PROJECT_NAME: "GIDO"
  INTERNAL_TOKEN: ""
  DEFAULT_TIMEZONE: "Asia/Shanghai"
  STUDIO_LOCK_ON_PUBLISH: "true"
  JAR_ARTIFACT_DIR: "/data/jar-artifacts"
  AVATAR_UPLOAD_DIR: "/data/user-avatars"

  # --- Flink Kubernetes Operator 1.15（CRD flinkVersion 须与运行时镜像一致）---
  FLINK_K8S_NAMESPACE: "flink"
  FLINK_K8S_CLUSTER_DOMAIN: "cluster.local"
  FLINK_OPERATOR_NAMESPACE: "flink"
  FLINK_OPERATOR_SERVICE_ACCOUNT: "flink"
  FLINK_OPERATOR_IMAGE: "__FLINK_OPERATOR_IMAGE__"
  FLINK_K8S_APPLICATION_IMAGE: "__FLINK_OPERATOR_IMAGE__"
  FLINK_OPERATOR_FLINK_VERSION: "__FLINK_OPERATOR_FLINK_VERSION__"
  FLINK_OPERATOR_IMAGE_PULL_SECRETS: "__FLINK_OPERATOR_IMAGE_PULL_SECRETS__"
  FLINK_OPERATOR_UPGRADE_MODE: "savepoint"
  FLINK_OPERATOR_CHECKPOINT_INTERVAL: "60s"
  FLINK_OPERATOR_UI_PROXY_ENABLED: "true"
  FLINK_OPERATOR_DEV_LOCAL: "false"
  FLINK_OPERATOR_AUTO_UI_TUNNEL: "false"
  FLINK_OPERATOR_JM_REST_TEMPLATE: "http://{deployment_name}-rest.{namespace}.svc.cluster.local:8081"
  FLINK_OPERATOR_JAR_HTTP_BASE: "http://backend.gido.svc.cluster.local:8001"
  FLINK_OPERATOR_SQL_RUNNER_JAR_URI: "local:///opt/flink/usrlib/sql-runner.jar"
  FLINK_OPERATOR_SQL_RUNNER_ENTRY_CLASS: "com.gido.flink.SqlRunner"
  FLINK_OPERATOR_JM_MEMORY: "2048m"
  FLINK_OPERATOR_TM_MEMORY: "2048m"
  FLINK_OPERATOR_JM_CPU: "1"
  FLINK_OPERATOR_TM_CPU: "1"
  FLINK_OPERATOR_TASK_SLOTS: "2"

  # --- S3 / 对象存储（平台默认；各 Operator 集群 Profile 可覆盖 region/endpoint/前缀/AK/SK）---
  # 示例：bucket=flink-on-devtest, prefix=gido-flink → s3://flink-on-devtest/gido-flink
  FLINK_OPERATOR_JAR_S3_PREFIX: "__FLINK_OPERATOR_JAR_S3_PREFIX__"
  GIDO_ARTIFACT_S3_REGION: "__GIDO_ARTIFACT_S3_REGION__"
  GIDO_ARTIFACT_S3_ENDPOINT_URL: "__GIDO_ARTIFACT_S3_ENDPOINT_URL__"
  FLINK_OPERATOR_S3_AUTH_MODE: "__FLINK_OPERATOR_S3_AUTH_MODE__"
  FLINK_OPERATOR_S3_USE_IRSA: "__FLINK_OPERATOR_S3_USE_IRSA__"
  FLINK_OPERATOR_S3_CREDENTIALS_PROVIDER: "com.amazonaws.auth.WebIdentityTokenCredentialsProvider"
  PAIMON_WAREHOUSE_DEFAULT: "__PAIMON_WAREHOUSE_DEFAULT__"
  FLINK_OPERATOR_CHECKPOINT_DIR: "__FLINK_OPERATOR_CHECKPOINT_DIR__"
  FLINK_OPERATOR_SAVEPOINT_DIR: "__FLINK_OPERATOR_SAVEPOINT_DIR__"

  # --- 未部署 Session / SQL Gateway ---
  FLINK_URL: ""
  FLINK_SQL_GATEWAY_URL: ""
  FLINK_GATEWAY_JOBMANAGER_REST_URL: ""
  FLINK_UI_URL: ""
  FLINK_K8S_APPLICATION_JM_REST_TEMPLATE: "http://{cluster_id}-rest.flink.svc.cluster.local:8081"
  FLINK_K8S_REST_EXPOSED_TYPE: "ClusterIP"
---
apiVersion: v1
kind: Secret
metadata:
  name: gido-secrets
  namespace: gido
type: Opaque
stringData:
  # 生产推荐：拆分 PG 变量（四项齐全时优先于 DATABASE_URL）
  INFRA_GIDO_DB_SERVICE_URL: "__PG_HOST__:__PG_PORT__"
  INFRA_GIDO_DB_SERVICE_USER: "__PG_USER__"
  INFRA_GIDO_DB_SERVICE_PASSWORD: "__PG_PASSWORD__"
  INFRA_GIDO_DB_URL: "__PG_DB__"
  # 兼容旧注入（可不填；与上四项二选一）
  # DATABASE_URL: "postgresql+psycopg2://user:pass@host:5432/gido"
  SECRET_KEY: "__SECRET_KEY__"
  FLINK_OPERATOR_ARTIFACT_TOKEN: "__ARTIFACT_TOKEN__"
  DS_TOKEN: ""
  GIDO_BOOTSTRAP_ADMIN_PASSWORD: "__ADMIN_PASSWORD__"
  # static S3 时也可写入（或单独 Secret gido-s3-credentials + envFrom）：
  # GIDO_S3_ACCESS_KEY_ID: ""
  # GIDO_S3_SECRET_ACCESS_KEY: ""
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gido-backend
  namespace: gido
  # EKS IRSA 示例（非 EKS 可删除 annotations 段）：
  # annotations:
  #   eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT:role/gido-backend-s3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gido-flink-operator
  namespace: flink
rules:
  - apiGroups: ["flink.apache.org"]
    resources: ["flinkdeployments", "flinksessionjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "pods", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gido-backend-flink-operator
  namespace: flink
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gido-flink-operator
subjects:
  - kind: ServiceAccount
    name: gido-backend
    namespace: gido
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gido-jar-artifacts
  namespace: gido
  labels:
    app: gido
    component: backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
  storageClassName: "__STORAGE_CLASS__"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gido-backend
  namespace: gido
  labels:
    app: gido
    component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gido
      component: backend
  template:
    metadata:
      labels:
        app: gido
        component: backend
    spec:
      serviceAccountName: gido-backend
      imagePullSecrets:
        - name: __GIDO_IMAGE_PULL_SECRET__
      initContainers:
        - name: wait-postgres
          image: docker.io/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until nc -z __PG_HOST__ __PG_PORT__; do
                echo "waiting postgres at __PG_HOST__:__PG_PORT__"; sleep 3
              done
      containers:
        - name: backend
          image: __BACKEND_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: gido-backend-config
            - secretRef:
                name: gido-secrets
            # static S3 AK/SK（可选，与 gido-secrets 二选一）：
            # - secretRef:
            #     name: gido-s3-credentials
            #     optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: "250m"
              memory: "768Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
          volumeMounts:
            - name: jar-artifacts
              mountPath: /data/jar-artifacts
      volumes:
        - name: jar-artifacts
          persistentVolumeClaim:
            claimName: gido-jar-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gido
spec:
  type: ClusterIP
  ports:
    - port: 8001
      targetPort: 8001
      name: http
  selector:
    app: gido
    component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gido-frontend
  namespace: gido
  labels:
    app: gido
    component: frontend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gido
      component: frontend
  template:
    metadata:
      labels:
        app: gido
        component: frontend
    spec:
      imagePullSecrets:
        - name: __GIDO_IMAGE_PULL_SECRET__
      initContainers:
        - name: wait-backend
          image: docker.io/library/busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              until wget -qO- http://backend:8001/health >/dev/null 2>&1; do
                echo waiting backend; sleep 3
              done
      containers:
        - name: frontend
          image: __FRONTEND_IMAGE__
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gido
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: gido
    component: frontend
