# Flink 作业 Pod 拉取 gido-flink-runtime（GHCR / 私有仓库）用 imagePullSecret
#
# 1) 在作业命名空间创建 Secret（默认 flink，与 FLINK_OPERATOR_NAMESPACE 一致）：
#    kubectl create namespace flink --dry-run=client -o yaml | kubectl apply -f -
#
#    kubectl create secret docker-registry ghcr-pull \
#      --docker-server=ghcr.io \
#      --docker-username=YOUR_GH_USER \
#      --docker-password=YOUR_GH_PAT \
#      --docker-email=you@example.com \
#      -n flink
#
# 2) gido-backend ConfigMap 设置：
#    FLINK_OPERATOR_IMAGE_PULL_SECRETS: "ghcr-pull"
#
# 3) rollout restart gido-backend，重新提交 Stream SQL/JAR 作业
#
# 多 Secret：FLINK_OPERATOR_IMAGE_PULL_SECRETS: "ghcr-pull,other-registry"
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: flink
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "CHANGE_ME_GH_USER",
          "password": "CHANGE_ME_GH_PAT",
          "email": "you@example.com",
          "auth": "CHANGE_ME_BASE64_USER_COLON_PAT"
        }
      }
    }
