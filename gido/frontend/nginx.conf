server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 入口 HTML 不缓存，避免发版后仍用旧 index 去拉已删除的 hashed JS
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # 构建产物必须真实存在；缺失时返回 404，禁止回落到 index.html（否则浏览器报 MIME text/html）
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        default_type image/svg+xml;
        alias /usr/share/nginx/html/favicon.svg;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* ^/(favicon\.svg|apple-touch-icon\.svg|site\.webmanifest)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # 须与 docker-compose 中的「服务名」一致（本仓库为 backend），勿写 container_name
    location /api {
        # 默认 1m 会导致 Flink JAR 上传被截断，表现为上传失败或 413
        client_max_body_size 256m;
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        # 提交 Flink SQL 会轮询网关，易超过默认 60s，否则浏览器看到 504
        proxy_connect_timeout 60s;
        proxy_send_timeout 320s;
        proxy_read_timeout 320s;
    }
}
