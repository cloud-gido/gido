#
# dev-1 分支专用 CI：构建/推送镜像到 GHCR 的 dev-1/ 子路径，与 dev 分支包名隔离。
# Flink 运行时按基座版本分仓库：
#   ghcr.io/<owner>/<repo>/dev-1/flink-runtime/2.2.1:dev-1
#   ghcr.io/<owner>/<repo>/dev-1/flink-runtime/1.17.2:dev-1
#   ghcr.io/<owner>/<repo>/dev-1/flink-runtime/2.0.1:dev-1

name: CI (dev-1)

on:
  push:
    branches: [dev-1]
  pull_request:
    branches: [dev-1]
  workflow_dispatch:

concurrency:
  group: ci-dev-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REGISTRY_USER: ${{ github.repository_owner }}
  # 与 dev 分支 ghcr.io/<repo>/gido-* 区分
  IMAGE_NAMESPACE: dev-1

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gido/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gido/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compliance:
    name: Open-source compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject legacy dataworks naming in source
        run: |
          set -euo pipefail
          matches="$(grep -ri dataworks . \
            --include='*.py' \
            --include='*.ts' \
            --include='*.tsx' \
            --include='*.yml' \
            --include='*.yaml' \
            --include='*.json' \
            --include='*.sh' \
            --include='*.sql' \
            --exclude-dir=node_modules \
            --exclude-dir=dist \
            --exclude-dir=.venv \
            --exclude-dir=__pycache__ \
            --exclude-dir=.github \
            --exclude='MIGRATION_FROM_DATAWORKS.md' \
            --exclude='add_spdx_headers.py' \
            || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Found legacy dataworks references"
            exit 1
          fi
      - name: Reject secrets in tracked env files
        run: |
          set -euo pipefail
          matches="$(grep -rE "(DS_TOKEN|SECRET_KEY|INTERNAL_TOKEN)=[^[:space:]]+" gido \
            --include="*.env" \
            | grep -v '.example' \
            || true)"
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Found secret-like values in .env files (use .env.example only)"
            exit 1
          fi
      - name: Verify SPDX headers in gido source
        run: python gido/scripts/add_spdx_headers.py
      - name: Fail if SPDX script modified files
        run: |
          if [ -n "$(git status --porcelain gido)" ]; then
            git status --porcelain gido
            echo "::error::Missing SPDX headers; run gido/scripts/add_spdx_headers.py"
            exit 1
          fi

  docker-images:
    name: Build and push dev-1 images to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-1'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Wait for GHCR and log in (single login for all images)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wait_ghcr() {
            local attempt code
            for attempt in $(seq 1 8); do
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                --connect-timeout 20 --max-time 45 \
                "https://ghcr.io/v2/" || true)
              if [ "${code}" = "401" ] || [ "${code}" = "200" ]; then
                echo "GHCR reachable (HTTP ${code}) on attempt ${attempt}"
                return 0
              fi
              echo "GHCR unreachable (HTTP ${code:-000}) attempt ${attempt}/8, sleep 25s..."
              sleep 25
            done
            return 1
          }
          login_ghcr() {
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin
          }
          for attempt in $(seq 1 5); do
            wait_ghcr || true
            if login_ghcr; then
              echo "GHCR login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "GHCR login attempt ${attempt}/5 failed, retry in 30s..."
            sleep 30
          done
          echo "::error::GHCR login failed after 5 attempts"
          exit 1

      - name: Extract metadata (tags, labels) for backend
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAMESPACE }}/gido-backend
          tags: |
            type=raw,value=dev-1
            type=sha,prefix=dev-1-

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: gido/backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          build-args: |
            PY_IMAGE=python:3.11-slim
            PIP_INDEX=https://pypi.org/simple

      - name: Extract metadata (tags, labels) for frontend
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAMESPACE }}/gido-frontend
          tags: |
            type=raw,value=dev-1
            type=sha,prefix=dev-1-

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: gido/frontend
          push: true
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}

  # Flink 运行时：ci_matrix 并行构建，各版本独立 GHCR 仓库路径 dev-1/flink-runtime/<flink_version>
  validate-flink-runtimes:
    name: Validate Flink runtime configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate ci_matrix (2.2.1 / 1.17.2 / 2.0.1)
        run: |
          set -euo pipefail
          python3 k8s/flink-runtime/scripts/render_build_context.py --validate-ci-matrix
          python3 k8s/flink-runtime/scripts/render_build_context.py --all
          python3 k8s/flink-runtime/scripts/render_build_context.py --list

  prepare-flink-matrix:
    name: Prepare Flink runtime matrix
    runs-on: ubuntu-latest
    needs: validate-flink-runtimes
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-1'
    outputs:
      runtime_keys: ${{ steps.matrix.outputs.runtime_keys }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: |
          set -euo pipefail
          KEYS=$(python3 k8s/flink-runtime/scripts/render_build_context.py --list-ci-matrix)
          echo "runtime_keys=${KEYS}" >> "$GITHUB_OUTPUT"
          echo "CI Flink runtime matrix: ${KEYS}"

  flink-runtime:
    name: Flink runtime (${{ matrix.runtime_key }})
    runs-on: ubuntu-latest
    needs: prepare-flink-matrix
    timeout-minutes: 120
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev-1'
    strategy:
      fail-fast: false
      matrix:
        runtime_key: ${{ fromJson(needs.prepare-flink-matrix.outputs.runtime_keys) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Render Flink runtime build context
        run: python3 k8s/flink-runtime/scripts/render_build_context.py "${{ matrix.runtime_key }}"

      - name: Resolve runtime profile
        id: runtime
        run: |
          set -euo pipefail
          RUNTIME_KEY="${{ matrix.runtime_key }}"
          FLINK_VERSION=$(python3 k8s/flink-runtime/scripts/render_build_context.py --print-flink-version "${RUNTIME_KEY}")
          FLINK_BASE_IMAGE=$(python3 k8s/flink-runtime/scripts/render_build_context.py --print-base-image "${RUNTIME_KEY}")
          SQL_RUNNER_VERSION=$(python3 k8s/flink-runtime/scripts/render_build_context.py --print-sql-runner-version)
          IMAGE_REPOSITORY="${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAMESPACE }}/flink-runtime/${FLINK_VERSION}"
          echo "RUNTIME_KEY=${RUNTIME_KEY}" >> "$GITHUB_OUTPUT"
          echo "FLINK_VERSION=${FLINK_VERSION}" >> "$GITHUB_OUTPUT"
          echo "FLINK_BASE_IMAGE=${FLINK_BASE_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "SQL_RUNNER_VERSION=${SQL_RUNNER_VERSION}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_REPOSITORY=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "Flink runtime ${RUNTIME_KEY} -> ${FLINK_BASE_IMAGE}"
          echo "GHCR image: ${IMAGE_REPOSITORY}:dev-1"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Wait for GHCR and log in
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          wait_ghcr() {
            local attempt code
            for attempt in $(seq 1 8); do
              code=$(curl -s -o /dev/null -w "%{http_code}" \
                --connect-timeout 20 --max-time 45 \
                "https://ghcr.io/v2/" || true)
              if [ "${code}" = "401" ] || [ "${code}" = "200" ]; then
                echo "GHCR reachable (HTTP ${code}) on attempt ${attempt}"
                return 0
              fi
              echo "GHCR unreachable (HTTP ${code:-000}) attempt ${attempt}/8, sleep 25s..."
              sleep 25
            done
            return 1
          }
          login_ghcr() {
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${REGISTRY_USER}" --password-stdin
          }
          for attempt in $(seq 1 5); do
            wait_ghcr || true
            if login_ghcr; then
              echo "GHCR login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "GHCR login attempt ${attempt}/5 failed, retry in 30s..."
            sleep 30
          done
          echo "::error::GHCR login failed after 5 attempts"
          exit 1

      - name: Extract metadata (tags, labels) for flink-runtime
        id: meta_flink
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.runtime.outputs.IMAGE_REPOSITORY }}
          tags: |
            type=raw,value=dev-1
            type=sha,prefix=dev-1-

      - name: Build and push flink-runtime image
        uses: docker/build-push-action@v5
        with:
          context: k8s/flink-sql-runner
          push: true
          no-cache: true
          tags: ${{ steps.meta_flink.outputs.tags }}
          labels: ${{ steps.meta_flink.outputs.labels }}
          build-args: |
            TARGETPLATFORM=linux/amd64
            RUNTIME_PROFILE=${{ steps.runtime.outputs.RUNTIME_KEY }}
            FLINK_BASE_IMAGE=${{ steps.runtime.outputs.FLINK_BASE_IMAGE }}
            SQL_RUNNER_ARTIFACT_VERSION=${{ steps.runtime.outputs.SQL_RUNNER_VERSION }}
            MAVEN_IMAGE=maven:3.9-eclipse-temurin-11
            MAVEN_SETTINGS=settings.ci.xml

      - name: Verify Flink runtime image (Paimon S3 deps)
        run: |
          set -euo pipefail
          chmod +x k8s/flink-runtime/scripts/verify-image.sh
          IMAGE="${{ steps.runtime.outputs.IMAGE_REPOSITORY }}:dev-1"
          for attempt in $(seq 1 5); do
            if docker pull "${IMAGE}"; then
              bash k8s/flink-runtime/scripts/verify-image.sh "${IMAGE}" "${{ steps.runtime.outputs.RUNTIME_KEY }}"
              exit 0
            fi
            echo "docker pull attempt ${attempt}/5 failed, retry in 20s..."
            sleep 20
          done
          echo "::error::docker pull ${IMAGE} failed after 5 attempts"
          exit 1
